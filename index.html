<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const storageKey = "shownIndexes";
    let urls = [];

    fetch("urls.json")
      .then(response => response.json())
      .then(data => {
        urls = data;
        redirectToRandomUrl();
      })
      .catch(error => {
        console.error("Failed to load URL list:", error);
        // Optional: fallback page or static redirect if fetch fails
      });

    function redirectToRandomUrl() {
      if (!urls.length) return;

      let shownIndexes = JSON.parse(localStorage.getItem(storageKey)) || [];
      let remainingIndexes = urls.map((_, i) => i).filter(i => !shownIndexes.includes(i));

      if (remainingIndexes.length === 0) {
        shownIndexes = [];
        remainingIndexes = urls.map((_, i) => i);
      }

      const randomIndex = remainingIndexes[Math.floor(Math.random() * remainingIndexes.length)];
      const chosenUrl = urls[randomIndex];

      shownIndexes.push(randomIndex);
      localStorage.setItem(storageKey, JSON.stringify(shownIndexes));

      // Redirect immediately
      window.location.replace(chosenUrl);
    }
  </script>
</head>
<body></body>
</html>
